name: Zelda stock watch

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay runs a bit)
  workflow_dispatch:          # lets you run it manually from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      # Remember last known stock so you only get alerted on a change
      - uses: actions/cache@v4
        with:
          path: zelda_state.json
          key: zelda-state-${{ github.run_id }}
          restore-keys: zelda-state-

      - run: python zelda_watch.py --once
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
